version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 15+ (App Router)
  - Auth.js v5 (Magic Links)
  - Prisma (Postgres + PostGIS)
  - TailwindCSS
  - Redis (Rate Limiting)
  - Framer Motion
features:
  - name: App Navigation (SPA)
    description: Single Page App navigation using a Bottom Navigation bar
    files:
      - components/BottomNavigation.tsx
      - app/page.tsx
    user_interactions:
      - "Navigate using buttons with labels: Inici, Explorar, Mapa, Perfil"
      - "Wait for SplashScreen (~800ms) before interacting"
  - name: Admin Dashboard & Security Gate
    description: Admin access protected by Auth.js v5 session and a legacy master password gate.
    files:
      - middleware.ts
      - components/admin/AdminSecurityGate.tsx
      - app/admin/page.tsx
    endpoints:
      - method: GET
        path: /api/admin/municipality
        description: Fetch municipality data for admin
        auth_required: true
    user_interactions:
      - "Unlock Admin gate using legacy password for testing"
      - "Click Accedir (data-testid='admin-gate-submit')"
  - name: Executive Impact Analytics
    description: Admin-facing KPIs and charts for territory impact.
    files:
      - components/admin/ExecutiveReport.tsx
      - app/api/analytics/executive-report/route.ts
    endpoints:
      - method: GET
        path: /api/analytics/executive-report
        description: Get executive impact KPIs
        auth_required: true
  - name: IA territorial Processing
    description: IA tools for generating quizzes and routes from territorial data.
    files:
      - app/api/ai/generate-quiz/route.ts
      - app/api/ai/generate-route/route.ts
    endpoints:
      - method: POST
        path: /api/ai/generate-quiz
        description: Generate quiz using IA
        auth_required: true
      - method: POST
        path: /api/ai/generate-route
        description: Generate route using IA
        auth_required: true
  - name: User Passport & XP Engine
    description: Gamification system with server-side validation.
    files:
      - lib/actions/gamification.ts
      - app/profile/page.tsx
known_limitations:
  - issue: Direct deep links to /profile or /map might fail (SPA limitation)
    location: app/page.tsx
    impact: Tests must start at root (/)
  - issue: Rate limiting active (5 req/5 min for login, 10 req/min for IA)
    location: lib/services/ratelimit.ts
    impact: Parallel test execution might trigger rate limits
